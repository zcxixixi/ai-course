name: 课程项目提交
description: 提交个人课程项目
title: "[项目提交] "
labels:
  - project-submission
body:
  - type: markdown
    attributes:
      value: |
        请提交可访问的个人项目链接。不要填写姓名、学号、手机号或其他个人敏感信息。
  - type: input
    id: student_id
    attributes:
      label: 唯一编号
      description: 格式为“班级-两位序号”，例如 2501-01。
      placeholder: "2501-01"
    validations:
      required: true
  - type: input
    id: project_url
    attributes:
      label: 项目链接
      description: GitHub 仓库、在线演示或其他可公开访问的项目地址。
      placeholder: "https://github.com/..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 项目说明
      description: 简要说明项目目标、主要功能、使用的 AI 技术和运行方式。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 运行结果
      description: 提供截图、演示链接、关键输出或其他完成证据。
    validations:
      required: true
