name: Grade Course Project

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Project submission issue number
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  grade:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'project-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai requests python-dotenv

      - name: Grade project
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.vectorengine.ai/v1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'qwen-flash' }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: python scripts/grade_project_issue.py
