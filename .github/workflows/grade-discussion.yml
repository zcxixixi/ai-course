name: Grade GitHub Discussion

on:
  discussion_comment:
    types: [created]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

concurrency:
  group: grade-discussion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        discussion: [17, 20, 22, 24, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-grading.txt

      - name: Grade and reply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.vectorengine.ai/v1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'qwen-flash' }}
          REPO_OWNER: zcxixixi
          REPO_NAME: ai-course
          DISCUSSION_NUMBER: ${{ matrix.discussion }}
        run: python scripts/grade_github_discussion.py --post-replies
